# WSL2 direct GPU access when NVIDIA Container Toolkit is not installed.
# Only apply inside WSL2. No privileged container or Docker socket is used.
services:
  benchmark:
    gpus: !reset []
    devices:
      - /dev/dxg:/dev/dxg
    volumes:
      - /usr/lib/wsl/lib:/usr/lib/wsl/lib:ro
      - /usr/lib/wsl/drivers:/usr/lib/wsl/drivers:ro
    environment:
      LD_LIBRARY_PATH: /usr/lib/wsl/lib:/opt/conda/lib
