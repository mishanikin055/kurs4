[tool.pytest.ini_options]
cache_dir = "/tmp/kurs4-pytest-cache"
testpaths = ["tests", "detection/tests", "classification/tests", "annotation/tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["data", "reports", "**/models/**", "Материалы для курсовой"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
