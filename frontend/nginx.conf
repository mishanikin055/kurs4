server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    client_max_body_size 11m;
    gzip on;
    gzip_types text/css application/javascript;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' blob:; style-src 'self'; script-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

    location = /api/docs {
        alias /usr/share/nginx/html/swagger.html;
        default_type text/html;
        expires -1;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; script-src 'self' https://cdn.jsdelivr.net; connect-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    }

    location = /docs {
        absolute_redirect off;
        return 302 /api/docs;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $backend http://backend:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ =404;
        expires -1;
    }

    location = /favicon.ico {
        return 204;
    }
}
