x-app: &app
  init: true
  env_file: .secrets/app.env
  restart: unless-stopped
  stop_grace_period: 60s
  tmpfs:
    - /tmp:size=1g,mode=1777
  volumes:
    - pending_inputs:/var/lib/kurs4/pending
  depends_on:
    elasticsearch:
      condition: service_healthy
    s3:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy

services:
  frontend:
    image: kurs4-frontend:0.3.5
    build:
      context: ./frontend
    restart: unless-stopped
    mem_limit: 64m
    ports:
      - "127.0.0.1:${APP_FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.6
    restart: unless-stopped
    mem_limit: 1g
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      xpack.ml.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    volumes:
      - esdata:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=2s' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  s3:
    image: kurs4-minio:RELEASE.2025-10-15T17-29-55Z
    build:
      context: .
      dockerfile: docker/minio.Dockerfile
    env_file: .secrets/app.env
    command: ["server", "/data", "--console-address", ":9001"]
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - s3data:/data
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:4-alpine@sha256:2cb43283d8bbd3caa6c0f0dc00e96c8de772df33df7fd8af6aee4d605aeb8ada
    hostname: kurs4-rabbitmq
    env_file: .secrets/app.env
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
  backend:
    <<: *app
    image: kurs4-backend:0.3.5
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: api
    mem_limit: 1g
    ports:
      - "127.0.0.1:${APP_HTTP_PORT:-8000}:8000"
  worker:
    <<: *app
    image: kurs4-worker:0.3.5
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: worker
    # Explicit opt-in: starting this service processes queued application images.
    profiles: ["processing"]
    restart: unless-stopped
    mem_limit: ${APP_WORKER_MEMORY:-5g}
    # Two resident models; startup checks headroom before consuming images.
    volumes:
      - pending_inputs:/var/lib/kurs4/pending
      - ./storage/locks:/var/lib/kurs4/locks
      - ./detection/models/rf_detr_small:/models/detection/models/rf_detr_small:ro
      - ./annotation/models/florence2_base_ft:/models/annotation/models/florence2_base_ft:ro
      - ./annotation/models/opus_mt_tc_big_en_zle:/models/annotation/models/opus_mt_tc_big_en_zle:ro
    environment:
      APP_LOCK_PATH: /var/lib/kurs4/locks/inference.lock
      APP_MODEL_ROOT: /models
      APP_DEVICE: ${APP_DEVICE:-cuda}

volumes:
  esdata:
  s3data:
  pending_inputs:
  rabbitmq_data:
