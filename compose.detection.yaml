x-runtime: &runtime
  image: kurs4-detection:v1
  build:
    context: .
    dockerfile: detection/Dockerfile
  init: true
  working_dir: /workspace
  user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
  environment:
    HOME: /tmp
    CONTAINER_IMAGE_ID: "${DETECTION_IMAGE_ID:-unrecorded}"
  volumes:
    - ./detection:/workspace/detection:ro
    - ./scripts:/workspace/scripts:ro
    - ./data:/workspace/data:ro
    - ./detection/models:/workspace/detection/models:ro
    - ./reports:/workspace/reports
    - ./storage/locks:/workspace/storage/locks
    - ./.git:/workspace/.git:ro
  mem_limit: 6g
  shm_size: 256m
  network_mode: none
services:
  benchmark:
    <<: *runtime
    gpus: all
  tools:
    <<: *runtime
    network_mode: bridge
    volumes:
      - ./detection:/workspace/detection:ro
      - ./scripts:/workspace/scripts:ro
      - ./detection/models:/workspace/detection/models
      - ./data:/workspace/data
      - ./reports:/workspace/reports
      - ./storage/locks:/workspace/storage/locks
      - ./.git:/workspace/.git:ro
  cpu:
    <<: *runtime
  checks:
    image: kurs4-detection:v1
    init: true
    network_mode: none
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    entrypoint: ["python"]
    environment:
      HOME: /tmp
      RUFF_CACHE_DIR: /tmp/ruff
    volumes:
      - ./:/workspace
      - ./detection/models:/workspace/detection/models:ro
      - ./data:/workspace/data:ro
    mem_limit: 6g
